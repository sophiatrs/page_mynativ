<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion — Mynativ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-20 p-6 text-gray-600 font-[450]">
    <h1 class="text-2xl text-black font-bold pb-6">
      Créer un nouveau programme
    </h1>
    <div class="border border-gray-300 border-[1.7px] rounded-lg p-6">
      <div class="flex flex-col">
        <form>
          <div class="flex flex-col lg:flex-row lg:w-full lg:gap-5">
            <div class="flex flex-col pb-5 flex-1">
              <label class="pb-2"
                ><span class="text-red-400">*</span> Nom du programme</label
              >
              <select
                type="email"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 px-2 focus:outline-none focus:border-[#3D60DD] cursor-pointer"
              >
                <option>Nom du programme</option>
                <option>France</option>
                <option>Italie</option>
                <option>Espagne</option>
              </select>
            </div>
            <div class="flex flex-col pb-5 flex-1">
              <label class="pb-2">Url du site web</label>
              <input
                type="email"
                placeholder="Url du site web"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 pl-3 focus:outline-none focus:border-[#3D60DD]"
              />
            </div>
          </div>
          <div class="flex flex-col lg:flex-row lg:w-full lg:gap-5">
            <div class="flex flex-col pb-5 lg:flex-1">
              <label class="pb-2"
                ><span class="text-red-400">*</span> Destination</label
              >
              <select
                type="email"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 px-2 focus:outline-none focus:border-[#3D60DD] cursor-pointer"
              >
                <option>Destination</option>
                <option>France</option>
                <option>Italie</option>
                <option>Espagne</option>
              </select>
            </div>
            <div class="flex flex-col pb-5 lg:flex-1">
              <label class="pb-2"
                ><span class="text-red-400">*</span> Marques</label
              >
              <select
                type="email"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 px-2 focus:outline-none focus:border-[#3D60DD] cursor-pointer"
              >
                <option>Marques</option>
                <option>France</option>
                <option>Italie</option>
                <option>Espagne</option>
              </select>
            </div>
          </div>
          <div class="flex flex-col lg:flex-row lg:w-full lg:gap-5">
            <div class="flex flex-col pb-5 lg:flex-1">
              <label class="pb-2">Nombre de jour</label>
              <input
                type="email"
                placeholder="Nombre de jour"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 pl-3 focus:outline-none focus:border-[#3D60DD] text-center"
              />
            </div>
            <div class="flex flex-col pb-5 lg:flex-1">
              <label class="pb-2">Prix</label>
              <input
                type="email"
                placeholder="Prix"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 pl-3 focus:outline-none focus:border-[#3D60DD] text-center"
              />
            </div>
          </div>
          <div class="flex flex-col lg:flex-row lg:w-full lg:gap-5">
            <div class="flex flex-col pb-5 lg:flex-1">
              <label class="pb-2">Positionnement prix</label>
              <select
                type="email"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 px-2 focus:outline-none focus:border-[#3D60DD] cursor-pointer"
              >
                <option>Positionnement prix</option>
                <option>France</option>
                <option>Italie</option>
                <option>Espagne</option>
              </select>
            </div>
            <div class="flex flex-col pb-5 lg:flex-1">
              <label class="pb-2">Positionnement client</label>
              <select
                type="email"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 px-2 focus:outline-none focus:border-[#3D60DD] cursor-pointer"
              >
                <option>Positionnement client</option>
                <option>France</option>
                <option>Italie</option>
                <option>Espagne</option>
              </select>
            </div>
            <div class="flex flex-col pb-5 lg:flex-1">
              <label class="pb-2">Positionnement stratégique</label>
              <select
                type="email"
                class="border-[1.7px] border-gray-200 rounded pt-1 pb-1 px-2 focus:outline-none focus:border-[#3D60DD] cursor-pointer"
              >
                <option>Positionnement stratégique</option>
                <option>France</option>
                <option>Italie</option>
                <option>Espagne</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="pt-5">
        <button
          class="bg-[#3D60DD] text-white rounded px-5 py-2 mr-3 cursor-pointer hover:bg-blue-400"
        >
          Sauvegarder
        </button>
        <button
          class="border border-[1.7px] border-gray-200 rounded px-5 py-2 cursor-pointer hover:bg-blue-100 hover:text-[#3D60DD] hover:border-[#3D60DD]"
        >
          Annuler
        </button>
      </div>
    </div>
  </body>
</html>
